name: Build Surge Reject Rules

on:
  # 每天北京时间 04:00 执行。
  schedule:
    - cron: "0 4 * * *"
      timezone: "Asia/Shanghai"

  # 允许在 Actions 页面手动执行。
  workflow_dispatch:

permissions:
  contents: write

# 防止定时任务和手动任务同时推送 release 分支。
concurrency:
  group: build-surge-reject
  cancel-in-progress: false

jobs:
  build:
    name: Merge and publish reject.list
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download, merge, and deduplicate rules
        shell: bash
        run: |
          set -euo pipefail

          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT

          urls=(
            "https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/Reject.list"
            "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list"
            "https://raw.githubusercontent.com/iab0x00/ProxyRules/main/Rule/Block.txt"
          )

          for index in "${!urls[@]}"; do
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              --output "$work_dir/source-$index.list" \
              "${urls[$index]}"

            if [[ ! -s "$work_dir/source-$index.list" ]]; then
              echo "::error::Downloaded source $((index + 1)) is empty."
              exit 1
            fi
          done

          # 去掉 BOM、CR、Surge 支持的三种注释和空行，再按首次出现的顺序去重。
          awk '
            FNR == 1 { sub(/^\xef\xbb\xbf/, "") }
            { sub(/\r$/, "") }
            /^[[:space:]]*(#|;|\/\/)/ || /^[[:space:]]*$/ { next }
            {
              # 行尾注释符前必须有空格，因此不会误删 https:// 等规则内容。
              sub(/[[:space:]]+(#|;|\/\/).*$/, "")
              sub(/^[[:space:]]+/, "")
              sub(/[[:space:]]+$/, "")
              if ($0 != "" && !seen[$0]++) {
                print
              }
            }
          ' "$work_dir"/source-*.list > "$RUNNER_TEMP/reject.list"

          # 如果 DOMAIN 中的 IP 已有对应单主机 IP-CIDR 规则，则删除冗余的 DOMAIN 规则。
          # 没有对应 IP-CIDR 规则时保留原规则，以免丢失有效匹配。
          python3 - "$RUNNER_TEMP/reject.list" <<'PY'
          import ipaddress
          import pathlib
          import sys

          output_path = pathlib.Path(sys.argv[1])
          rules = output_path.read_text(encoding="utf-8").splitlines()

          single_ip_rules = set()
          for rule in rules:
              parts = [part.strip() for part in rule.split(",")]
              if len(parts) < 2 or parts[0] not in {"IP-CIDR", "IP-CIDR6"}:
                  continue

              try:
                  network = ipaddress.ip_network(parts[1], strict=False)
              except ValueError:
                  continue

              expected_version = 4 if parts[0] == "IP-CIDR" else 6
              if (
                  network.version == expected_version
                  and network.prefixlen == network.max_prefixlen
              ):
                  single_ip_rules.add(network.network_address)

          filtered_rules = []
          removed_rules = []
          for rule in rules:
              parts = [part.strip() for part in rule.split(",", 2)]
              if len(parts) >= 2 and parts[0] == "DOMAIN":
                  try:
                      domain_ip = ipaddress.ip_address(parts[1])
                  except ValueError:
                      domain_ip = None

                  if domain_ip is not None and domain_ip in single_ip_rules:
                      removed_rules.append(rule)
                      continue

              filtered_rules.append(rule)

          output_path.write_text(
              "\n".join(filtered_rules) + "\n",
              encoding="utf-8",
          )

          for rule in removed_rules:
              print(f"Removed redundant DOMAIN rule: {rule}")
          PY

          if [[ ! -s "$RUNNER_TEMP/reject.list" ]]; then
            echo "::error::The merged reject.list is empty."
            exit 1
          fi

          # 三个上游文件都应当是 Surge RULE-SET；阻止错误页面或异常内容被发布。
          if invalid_line="$(grep -m 1 -Ev '^[A-Z][A-Z0-9-]*,.+$' "$RUNNER_TEMP/reject.list")"; then
            echo "::error::Invalid Surge rule found: $invalid_line"
            exit 1
          fi

          echo "Merged $(wc -l < "$RUNNER_TEMP/reject.list") unique rules."

      - name: Publish only reject.list to release branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 孤儿分支没有主分支的提交历史或文件，只加入生成文件。
          git switch --orphan release-build
          cp "$RUNNER_TEMP/reject.list" reject.list
          git add reject.list

          if [[ "$(git ls-files)" != "reject.list" ]]; then
            echo "::error::The release commit must contain only reject.list."
            exit 1
          fi

          git commit -m "Update reject.list"
          git push --force origin HEAD:release
